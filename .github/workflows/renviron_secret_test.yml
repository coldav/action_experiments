name: Renviron secret newline test

# Investigates whether a GitHub Actions secret round-trips a \n-escaped
# multi-line PEM value identically to the same value hardcoded directly
# in the workflow YAML. Writes both to .Renviron-shaped files, uploads
# both as artifacts, and byte-diffs them in the run log.
#
# Set a repo secret named TEST_PEM_SECRET to EXACTLY this value (single
# line, literal backslash-n, no real newlines) before running:
#
# -----BEGIN PUBLIC KEY-----\nMIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEArZU2DNcHSbbY2Dp5LePX\n0F/dyC4hkvsCZvNxzmGLG2IiC2nXisTcCvaKinKJnqkNHPPgOgJyOAXSu5a7StES\niMBET/hCMTJXbyKpHkpKG4ERtHyakNKuad/bJx95GJTa3sgAqZRFNVvDb50BMKjz\nzgLnWIAcvSWdbk4lm0RWXV4nyQwzZoSa7TGeLGVnknDa34oKsBHQPVJLmWlL7lmJ\n6G2dGwVawo582rHqf+ZvkDOnrOL4V0jaXQ7/1NDNDtiMbLGrw6mES43lpN43ZDw5\nlM+MWZO+d+KGAA7Qq2hGM+gQuNHTaTVUbfh02D9+/Dr8n/iarj7rYamaKz6YEnJ0\nJQIDAQAB\n-----END PUBLIC KEY-----
#
# This is a throwaway toy key pair generated only for this test -- never
# used anywhere real, safe to have in a public repo.

on:
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    env:
      TEST_PEM_SECRET: ${{ secrets.TEST_PEM_SECRET }}
    steps:
      - name: Write .Renviron from hardcoded literal
        run: |
          echo "TEST_PEM_HARDCODED=-----BEGIN PUBLIC KEY-----\nMIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEArZU2DNcHSbbY2Dp5LePX\n0F/dyC4hkvsCZvNxzmGLG2IiC2nXisTcCvaKinKJnqkNHPPgOgJyOAXSu5a7StES\niMBET/hCMTJXbyKpHkpKG4ERtHyakNKuad/bJx95GJTa3sgAqZRFNVvDb50BMKjz\nzgLnWIAcvSWdbk4lm0RWXV4nyQwzZoSa7TGeLGVnknDa34oKsBHQPVJLmWlL7lmJ\n6G2dGwVawo582rHqf+ZvkDOnrOL4V0jaXQ7/1NDNDtiMbLGrw6mES43lpN43ZDw5\nlM+MWZO+d+KGAA7Qq2hGM+gQuNHTaTVUbfh02D9+/Dr8n/iarj7rYamaKz6YEnJ0\nJQIDAQAB\n-----END PUBLIC KEY-----" > hardcoded.Renviron

      - name: Write .Renviron from GitHub Secret
        run: |
          echo "TEST_PEM_SECRET=$TEST_PEM_SECRET" > secret.Renviron

      - name: Show byte-level diff (od -c) of both files
        run: |
          echo "=== hardcoded.Renviron (od -c) ==="
          od -c hardcoded.Renviron | head -5
          echo "=== secret.Renviron (od -c) ==="
          od -c secret.Renviron | head -5
          echo "=== diff (strip the var name prefix so only the value is compared) ==="
          sed 's/^TEST_PEM_HARDCODED=//' hardcoded.Renviron > hardcoded.value
          sed 's/^TEST_PEM_SECRET=//' secret.Renviron > secret.value
          if diff -u hardcoded.value secret.value; then
            echo "IDENTICAL"
          else
            echo "DIFFERENT -- see diff above"
          fi
          echo "=== lengths ==="
          wc -c hardcoded.value secret.value

      - name: Upload both .Renviron files as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: renviron-comparison
          path: |
            hardcoded.Renviron
            secret.Renviron
            hardcoded.value
            secret.value
